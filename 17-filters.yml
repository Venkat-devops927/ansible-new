- name: filter the values
  hosts: local
  connection: local
  tasks:
  - name: conveert to map list
    vars:
      course:
        name: "devops with aws"
        duration: 120hrs
        trainer: shiva
    ansible.builtin.debug:
      msg: "{{ course | dict2items }}"

  - name: Convert list to map
    vars:
      course:
        - key: name
          value: "devops with aws"
        - key: duration
          value: "120hrs"
        - key: trainer
          value: "shiva"
    ansible.builtin.debug:
      msg: "{{ course | items2dict }}"  



- name: check ip adress
    vars:
      myip: 192.168.1.1
  ansible.builtin.debug:
    msg: "{{ myip | ansible.utils.ipv4 }}"

